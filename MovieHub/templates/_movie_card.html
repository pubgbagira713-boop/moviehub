<a class="movie-card" href="{{ url_for('movie_detail', movie_id=movie.id) }}"><div class="poster-wrap"><img src="{{ movie.poster_url }}" alt="{{ movie.title }} poster"><span class="quality-pill">{{ '1080p' if movie.video_1080 else 'HD' }}</span><span class="play-icon">▶</span></div><div class="card-info"><h3>{{ movie.title }}</h3><div><span>{{ movie.year }}</span><span>{{ movie.language }}</span><span class="rating">★ {{ '%.1f'|format(movie.rating) }}</span></div></div></a>
