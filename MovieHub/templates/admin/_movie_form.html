<form class="movie-form" method="post" enctype="multipart/form-data"><div class="form-grid"><label>Title<input name="title" value="{{ movie.title if movie else '' }}" required></label><label>Language<select name="language">{% for item in languages %}<option {% if movie and movie.language == item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></label><label>Genre<input name="genre" value="{{ movie.genre if movie else '' }}" required></label><label>Release year<input type="number" name="year" value="{{ movie.year if movie else '' }}" required></label><label>Release date<input type="date" name="release_date" value="{{ movie.release_date.isoformat() if movie and movie.release_date else '' }}"></label><label>Rating<input type="number" name="rating" min="0" max="10" step="0.1" value="{{ movie.rating if movie else 0 }}"></label><label>Duration<input name="duration" value="{{ movie.duration if movie else '' }}" placeholder="2h 05m"></label><label>Director<input name="director" value="{{ movie.director if movie else '' }}"></label><label>Cast<input name="cast" value="{{ movie.cast if movie else '' }}"></label></div><label>Description / overview<textarea name="description" rows="5" required>{{ movie.description if movie else '' }}</textarea></label><div class="upload-grid"><label>Poster image<input type="file" name="poster" accept="image/*"></label><label>Trailer URL<input type="url" name="trailer_url" value="{{ movie.trailer_url if movie and movie.trailer_url else '' }}" placeholder="https://www.youtube.com/watch?v=..."></label></div><div class="url-grid"><label>4K UHD download URL<input type="url" name="video_4k_url" value="{{ movie.video_4k_url if movie else '' }}" placeholder="https://authorized-storage.example/movie-4k.mp4"></label><label>1080p HD download URL<input type="url" name="video_1080_url" value="{{ movie.video_1080_url if movie else '' }}" placeholder="https://authorized-storage.example/movie-1080p.mp4"></label><label>720p HD download URL<input type="url" name="video_720_url" value="{{ movie.video_720_url if movie else '' }}" placeholder="https://authorized-storage.example/movie-720p.mp4"></label><label>480p HD download URL<input type="url" name="video_480_url" value="{{ movie.video_480_url if movie else '' }}" placeholder="https://authorized-storage.example/movie-480p.mp4"></label></div><label class="check-label"><input type="checkbox" name="featured" {% if movie and movie.featured %}checked{% endif %}> Feature this movie on the home page</label><button class="button button-primary" type="submit">Save movie</button></form>
