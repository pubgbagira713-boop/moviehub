<form class="movie-form" method="post" enctype="multipart/form-data"><div class="form-grid"><label>Title<input name="title" value="{{ movie.title if movie else '' }}" required></label><label>Language<select name="language">{% for item in languages %}<option {% if movie and movie.language == item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></label><label>Genre<input name="genre" value="{{ movie.genre if movie else '' }}" required></label><label>Year<input type="number" name="year" value="{{ movie.year if movie else '' }}" required></label><label>Release date<input type="date" name="release_date" value="{{ movie.release_date.isoformat() if movie and movie.release_date else '' }}"></label><label>Rating<input type="number" name="rating" min="0" max="10" step="0.1" value="{{ movie.rating if movie else 0 }}"></label><label>Duration<input name="duration" value="{{ movie.duration if movie else '' }}" placeholder="2h 05m"></label><label>Cast<input name="cast" value="{{ movie.cast if movie else '' }}"></label></div><label>Description<textarea name="description" rows="5" required>{{ movie.description if movie else '' }}</textarea></label><div class="upload-grid"><label>Poster<input type="file" name="poster" accept="image/*"></label><label>Trailer<input type="file" name="trailer" accept="video/*"></label><label>480p video<input type="file" name="video_480" accept="video/*"></label><label>720p video<input type="file" name="video_720" accept="video/*"></label><label>1080p video<input type="file" name="video_1080" accept="video/*"></label></div><label class="check-label"><input type="checkbox" name="featured" {% if movie and movie.featured %}checked{% endif %}> Feature this movie on the home page</label><button class="button button-primary" type="submit">Save movie</button></form>
